name: Labs CI

on:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install development tools
        run: |
          python -m pip install -r ruff-lab/requirements-dev.txt
          python -m pip install -r sql-lab/requirements-dev.txt

      - name: Run tests
        run: >-
          python -m pytest -q
          json-config-lab argparse-lab module-import-lab
          package-install-lab ruff-lab sql-lab

      - name: Run Ruff lint
        run: ruff check --config ruff-lab/pyproject.toml ruff-lab

      - name: Check Ruff formatting
        run: ruff format --check --config ruff-lab/pyproject.toml ruff-lab
